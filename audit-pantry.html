<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/audit-pantry.js" type="module" defer></script>
    <title>Audit</title>
</head>

<body>
    <header id="main-header"></header>
    <main>
        <h1>Pantry Audit</h1>
        <button id="add-new-pantry-item-button">Add New Pantry Item</button>
        <button id="add-new-food-item-button">Upload New Food Item</button>
        <form id="add-new-pantry-item-form" class="hidden">
            <label for="item">Item</label>
            <select id="item" name="item" required></select>
            <label for="quantity">Quantity</label>
            <select id="quantity" name="quantity"></select>
            <input type="submit" title="Add To Pantry" id="add-to-pantry-submission" value="Add Item to Pantry"> 
        </form>
        <form id="add-new-food-item-form" class="hidden">
            <label for="food-item">Item</label>
            <input type="text" id="food-item" name="food-item" required>
            
            <!--<label for="expiration-date">Expiration Date</label>
                    <input type="text" id="expiration-date" name="expiration-date" required>-->
            <input type="submit" title="Add To Food List" id="add-to-food-list-submission" value="Add Food">
        </form>
        <h2>Add or Remove Pantry Contents</h2>
        <div id="pantry-contents"></div>
        <h2>food items</h2>
        <div id="saved-foods-list"></div>
    </main>
    <footer id="main-footer"></footer>
</body>

</html>
