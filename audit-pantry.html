<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <script src="js/audit-pantry.js" type="module" defer></script>
    <title>Audit</title>
</head>

<body>
    <header id="main-header"></header>
    <main class="container text-center">
        <h1>Pantry Audit</h1>
        <button id="add-new-pantry-item-button">Add New Pantry Item</button>
        <button id="add-new-food-item-button">Upload New Food Item</button>
        <form id="add-new-pantry-item-form" class="hidden">
            <label for="item" class="form-label">Item</label>
            <select id="item" name="item" class="form-control" required></select>
            <label for="quantity" class="form-label">Quantity</label>
            <select id="quantity" name="quantity" class="form-control"></select>
            <input type="submit" title="Add To Pantry" id="add-to-pantry-submission" class="form-control" value="Add Item to Pantry"> 
        </form>
        <form id="add-new-food-item-form" class="hidden">
            <label for="food-item" class="form-label">Item</label>
            <input type="text" id="food-item" name="food-item" class="form-control" required>
            <input type="submit" title="Add To Food List" id="add-to-food-list-submission" class="form-control" value="Add Food">
        </form>
        <h2>Add or Remove Pantry Contents</h2>
        <ul id="pantry-contents" class="list-unstyled"></ul>
        <h2>food items</h2>
        <ul id="saved-foods-list" class="list-unstyled"></ul>
    </main>
    <footer id="main-footer"></footer>
</body>

</html>
